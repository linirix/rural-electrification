name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    name: Package
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package release
        run: ./scripts/package_release.sh
      - name: Smoke release package
        run: ./scripts/smoke_release_bundle.sh dist/*.tar.gz
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: electrification-${{ matrix.os }}
          path: dist/*.tar.gz
