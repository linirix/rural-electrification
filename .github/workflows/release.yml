name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package release
        shell: bash
        run: ./scripts/package_release.sh
      - name: Smoke release package
        shell: bash
        run: ./scripts/smoke_release_bundle.sh dist/*.tar.gz
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: electrification-${{ matrix.os }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s globstar nullglob
          files=(release-artifacts/**/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no release packages found" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "Electrification $TAG_NAME" \
              --notes "Release $TAG_NAME" \
              --verify-tag
          fi
