[package]
name = "electrification"
version = "0.1.4"
edition = "2024"
rust-version = "1.87"
description = "A terminal-first economic and management simulator about running an electric utility."
readme = "README.md"
publish = false
default-run = "electrification"

[lib]
name = "electrification"
path = "src/lib.rs"

[dependencies]
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "electrification"
path = "src/main.rs"

[[bin]]
name = "playtest"
path = "src/bin/playtest.rs"

[[bin]]
name = "stress_scan"
path = "src/bin/stress_scan.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
